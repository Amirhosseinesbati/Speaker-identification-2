; Register only. Start after the configured preflight passes.
[program:speaker_id_campp_f002]
directory=/workspace/Speaker-identification-2
command=/bin/bash /workspace/Speaker-identification-2/scripts/infra/run_campp_experiment.sh configs/train/campp_finetune_warmup.json
user=root
numprocs=1
autostart=false
autorestart=false
startsecs=0
startretries=0
exitcodes=0
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=false
stdout_logfile=/workspace/Speaker-identification-2/artifacts/logs/campp_f002.stdout.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/workspace/Speaker-identification-2/artifacts/logs/campp_f002.stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
